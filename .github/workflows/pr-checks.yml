name: PR checks

# Deploy runs only on push to main, so until this existed nothing built a
# pull request. A syntax error (c84633a) and two months of llms.txt drift both
# reached main that way — the deploy was the first thing to notice, after merge.
#
# This runs the same `npm run build` the deploy runs, so a PR that cannot build
# is visible before it is merged rather than after. That includes the postbuild
# llms.txt drift gate (scripts/audit-llms-txt.mjs).

on:
  # No `branches:` filter on purpose. That filter matches the *base* branch, so
  # it would skip stacked PRs (one feature branch based on another) — exactly
  # the PRs most likely to be built on something unverified.
  pull_request:
  workflow_dispatch:

# El permiso de escritura se concede SOLO al job `stamp`, no a este nivel:
# `build` corre en cualquier PR, incluidos los de forks, y no necesita escribir.
permissions:
  contents: read

# A new push to the same PR supersedes the previous run.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Sella .seo-lastmod.json ANTES de construir.
  #
  # Antes esto vivía en su propio workflow (agent-pr-lastmod.yml) y corría en
  # PARALELO con el build. El build hacía checkout antes de que el sellado
  # empujara su commit, así que TODO PR de agente fallaba en la primera vuelta
  # y solo pasaba si algo disparaba una segunda ronda. El PR #117 se quedó tres
  # días en rojo por esto, cuando el arreglo ya existía.
  #
  # Como job del mismo workflow, `needs:` garantiza el orden y converge en una
  # sola pasada.
  stamp:
    name: Stamp lastmod
    # Solo ramas de agente, y nunca desde un fork: no tendría permisos, y
    # dejarlo abierto permitiría escribir en el repo con cualquier PR.
    #
    # `seo/` faltaba en esta lista (añadido 2026-09-08). El ejecutor del
    # seo-agent nombra sus ramas `seo/<audit>-<fecha>-<hora>`, así que el
    # sellado se saltaba, el gate de lastmod tumbaba el build y TODOS sus PRs
    # nacían en rojo. Cuatro se quedaron muertos así, incluidos los del bloque
    # nominador. Si aparece un prefijo de agente nuevo, va aquí.
    #
    # Volvió a pasar con `seo-auto/` (añadido 2026-09-23): el carril que
    # publica sin merge humano estrena prefijo propio desde el Sprint 3, y
    # su primer PR (#276, 29 redirecciones) nació en rojo. Un carril que se
    # mergea solo nunca llegaba a mergearse.
    if: >
      (startsWith(github.head_ref, 'quality/') ||
       startsWith(github.head_ref, 'content/') ||
       startsWith(github.head_ref, 'seo/') ||
       startsWith(github.head_ref, 'seo-auto/') ||
       startsWith(github.head_ref, 'changelog/')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El build falla a propósito cuando .seo-lastmod.json está desfasado,
      # y es al fallar cuando deja el fichero actualizado en disco. Por eso
      # se ignora el código de salida: lo que importa es el fichero.
      - name: Build (se permite que falle por el gate de lastmod)
        run: npm run build || true

      - name: Commit .seo-lastmod.json si cambió
        run: |
          if git diff --quiet -- .seo-lastmod.json; then
            echo "Sin cambios en .seo-lastmod.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .seo-lastmod.json
          # [skip ci] es deliberado: sin él, este push dispara una ronda nueva
          # de pr-checks que —por el `concurrency` con cancel-in-progress—
          # cancela la que está corriendo, justo después de haber ordenado el
          # sellado antes del build. Con el skip, el `build` de ESTA ronda ya
          # hace checkout de la punta sellada y todo converge en una pasada.
          git commit -m "chore: actualiza .seo-lastmod.json del PR [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

  build:
    name: build
    runs-on: ubuntu-latest
    # `always()` para que un PR normal —donde `stamp` se salta por el `if`—
    # siga construyendo; sin esto, un `needs` sobre un job saltado cancela.
    needs: [stamp]
    if: always() && needs.stamp.result != 'failure'
    steps:
      # Action majors kept in lockstep with deploy.yml — this workflow is only
      # a useful pre-merge signal if it builds the way the deploy builds.
      # En ramas de agente hay que coger la PUNTA DE LA RAMA, no el merge
      # commit que GitHub calcula para el PR: el sellado acaba de empujar un
      # commit y el merge ref puede tardar en recalcularse. En el resto de
      # PRs se mantiene el merge ref, que es lo correcto para verificar
      # antes de mergear.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.stamp.result == 'success' && github.head_ref || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Mirrors the deploy build exactly: prebuild (OG images, image
      # optimization) → next build → postbuild (llms.txt drift gate, CSP gate,
      # Markdown twin generation, SEO/GEO audit gate).
      # Deliberately not `next build` alone, so the gates run here too.
      - run: npm run build

      # Asserts on the built output: sitemap integrity, metadata uniqueness,
      # canonicals, Open Graph completeness, one h1 per page, FAQ schema that
      # matches visible text, Markdown twin quality, robots.txt AI policy.
      # `npm run build` already fails on these via scripts/seo-audit.mjs; this
      # step reports them per-rule so a failure names the regression.
      - run: npm test

      # WCAG AA colour contrast, measured in a real browser against the built
      # pages. Not part of `npm run build`: it needs Chrome, and the build has
      # to keep working on a machine without one. ubuntu-latest ships Chrome.
      #
      # It gates regressions, not perfection — .contrast-baseline.json records
      # the known v3 debt and the script fails if a pair is new or grows.
      - run: npm run audit:contrast
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # Surfaces tracked files the build rewrites. Warn only: the deploy
      # rewrites them the same way, so this does not affect what ships.
      #
      # This should now be silent. The two known sources of expected churn are
      # gone — blog-modified.json was deleted, and optimize-images.mjs decides
      # freshness by source hash rather than mtime, so a fresh checkout no
      # longer re-encodes images it should have skipped.
      #
      # So if it fires, treat it as real. The likely cause is a stale
      # scripts/image-manifest.json: someone changed an image or an encoder
      # setting and did not commit the regenerated outputs plus manifest.
      - name: Check for build-modified tracked files
        if: always()
        run: |
          if ! git diff --quiet; then
            echo "::warning::The build modified tracked files. Diff follows."
            git diff --stat
          fi
