name: Monthly GEO share-of-voice run

# The measurement half of SEO-STRATEGY.md §9b. Three consecutive monthly reports
# logged Perplexity and ChatGPT as "pending manual run", so two thirds of the
# series was never taken. This runs the prompts, scores them, and opens a PR with
# the report — a human still reads and interprets it, but nobody has to remember
# to paste prompts into three browsers.
on:
  schedule:
    - cron: "0 6 3 * *" # 06:00 UTC on the 3rd, matching the manual run cadence
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per prompt-engine pair (§9b says 3)"
        required: false
        default: "3"
        type: string
      engines:
        description: "Comma-separated subset of anthropic, openai, perplexity, gemini. Empty = all with a key."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: geo-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Run the §9b prompt list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # No key for an engine means that engine is reported as "not run" rather
      # than scored 0 — see the honesty rules at the top of the script. The job
      # fails only if NO engine has a key, because then there is nothing to
      # measure and a report would be fiction.
      - name: Probe the answer engines
        env:
          # Repo secrets are named *_GEO_APIKEY (dedicated to this probe); the
          # script reads the provider's conventional variable names.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_GEO_APIKEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_GEO_APIKEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_GEO_APIKEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_GEO_APIKEY }}
        run: |
          node scripts/geo-probe.mjs \
            --runs "${{ inputs.runs || '3' }}" \
            --engines "${{ inputs.engines || '' }}"

      - name: Open a PR with the report
        uses: peter-evans/create-pull-request@v7
        with:
          branch: geo/monthly-run
          base: main
          title: "GEO run — automated share-of-voice report"
          commit-message: |
            chore(geo): monthly answer-engine share-of-voice run

            Generated by scripts/geo-probe.mjs from the prompt list in
            SEO-STRATEGY.md §9b. Raw engine responses are in the .json
            beside the report, so every score can be checked against what
            the engine actually said.
          body: |
            Automated run of the prompt tracking list in `SEO-STRATEGY.md` §9b, read at run time.

            **Read the report before merging.** The script measures and scores; it does not
            interpret. Engines without an API key are reported as *not run* and are absent
            from the scores — they are never counted as 0, because "we did not ask" and
            "it did not name us" are different facts.

            The raw responses are committed alongside the report, so any score can be
            checked against what the engine actually said.

            The log row for §9b is at the bottom of the report, ready to paste.
          add-paths: |
            .seo-audit/geo-runs/*.md
            .seo-audit/geo-runs/*.json
